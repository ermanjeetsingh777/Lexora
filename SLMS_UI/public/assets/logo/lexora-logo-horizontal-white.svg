<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="100%" height="100%" fill="none">
  <defs>
    <!-- Base Open Book Gradients -->
    <linearGradient id="whz_bk_orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="40%" stop-color="#F97316" />
      <stop offset="85%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>

    <linearGradient id="whz_bk_green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="40%" stop-color="#22C55E" />
      <stop offset="85%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#BBF7D0" />
    </linearGradient>

    <linearGradient id="whz_bk_cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="40%" stop-color="#0EA5E9" />
      <stop offset="85%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>

    <linearGradient id="whz_l_body" x1="200" y1="40" x2="260" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B2545" />
      <stop offset="35%" stop-color="#071B34" />
      <stop offset="100%" stop-color="#030E1F" />
    </linearGradient>

    <linearGradient id="whz_l_top_curve" x1="200" y1="30" x2="270" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="40%" stop-color="#0077B6" />
      <stop offset="100%" stop-color="#03045E" />
    </linearGradient>

    <linearGradient id="whz_l_swoop_glow" x1="240" y1="280" x2="330" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0077B6" />
      <stop offset="45%" stop-color="#00B4D8" />
      <stop offset="80%" stop-color="#48CAE4" />
      <stop offset="100%" stop-color="#90E0EF" />
    </linearGradient>

    <linearGradient id="whz_l_swoop_top_rim" x1="240" y1="260" x2="330" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#48CAE4" />
      <stop offset="50%" stop-color="#90E0EF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <linearGradient id="whz_cube_orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="whz_cube_cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Wordmark 'X' Gradient -->
    <linearGradient id="whz_x_leg_back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="50%" stop-color="#0077B6" />
      <stop offset="100%" stop-color="#003566" />
    </linearGradient>

    <linearGradient id="whz_x_leg_front" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#90E0EF" />
      <stop offset="35%" stop-color="#00B4D8" />
      <stop offset="70%" stop-color="#0077B6" />
      <stop offset="100%" stop-color="#03045E" />
    </linearGradient>
  </defs>

  <!-- ==================== 1. EMBLEM (LEFT-ALIGNED) ==================== -->
  <g transform="translate(10, 5) scale(0.42)">
    <!-- Base Open Book Solid Wings -->
    <path d="M 250 330 C 185 330 115 305 60 270 C 55 285 110 325 240 348 C 245 349 248 352 250 354 Z" fill="#051937" />
    <path d="M 250 330 C 315 330 385 305 440 270 C 445 285 390 325 260 348 C 255 349 252 352 250 354 Z" fill="#051937" />

    <!-- Left Open Book Fanned Ribbons -->
    <path d="M 250 328 C 185 328 115 303 65 268 C 115 292 185 316 250 318 Z" fill="#003566" />
    <path d="M 250 316 C 185 314 125 290 75 258 C 125 280 185 304 250 306 Z" fill="#0077B6" />
    <path d="M 250 304 C 190 300 135 278 88 248 C 135 268 190 292 250 294 Z" fill="#00B4D8" />
    <path d="M 250 292 C 195 286 148 266 102 238 C 148 256 195 278 250 282 Z" fill="#90E0EF" />

    <!-- Right Open Book Fanned Ribbons -->
    <path d="M 250 328 C 315 328 385 303 435 268 C 385 292 315 316 250 318 Z" fill="#003566" />
    <path d="M 250 316 C 315 314 375 290 425 258 C 375 280 315 304 250 306 Z" fill="#0077B6" />
    <path d="M 250 304 C 310 300 365 278 412 248 C 365 268 310 292 250 294 Z" fill="#00B4D8" />
    <path d="M 250 292 C 305 286 352 266 398 238 C 352 256 305 278 250 282 Z" fill="#90E0EF" />

    <!-- Center Spine Semi-Circle Pedestal -->
    <path d="M 238 348 C 238 360 262 360 262 348 C 255 352 245 352 238 348 Z" fill="#001845" />

    <!-- 3 Standing Books -->
    <!-- Orange -->
    <g>
      <path d="M 124 200 L 138 194 L 143 201 L 129 207 Z" fill="#FED7AA" />
      <path d="M 138 194 L 143 201 L 143 250 L 138 244 Z" fill="#C2410C" opacity="0.6" />
      <path d="M 124 200 L 138 204 L 138 256 L 124 250 Z" fill="url(#whz_bk_orange)" />
      <rect x="127" y="210" width="8" height="2.5" rx="0.8" fill="#FFFFFF" />
      <rect x="127" y="238" width="8" height="2.5" rx="0.8" fill="#FFFFFF" />
    </g>

    <!-- Green -->
    <g>
      <path d="M 148 168 L 163 162 L 168 170 L 153 176 Z" fill="#BBF7D0" />
      <path d="M 163 162 L 168 170 L 168 260 L 163 252 Z" fill="#15803D" opacity="0.6" />
      <path d="M 148 168 L 163 173 L 163 264 L 148 258 Z" fill="url(#whz_bk_green)" />
      <rect x="151.5" y="180" width="8.5" height="3" rx="0.8" fill="#FFFFFF" />
      <rect x="151.5" y="244" width="8.5" height="3" rx="0.8" fill="#FFFFFF" />
    </g>

    <!-- Cyan -->
    <g>
      <path d="M 172 136 L 188 130 L 194 138 L 178 144 Z" fill="#BAE6FD" />
      <path d="M 188 130 L 194 138 L 194 270 L 188 262 Z" fill="#0369A1" opacity="0.6" />
      <path d="M 172 136 L 188 141 L 188 274 L 172 268 Z" fill="url(#whz_bk_cyan)" />
      <rect x="176" y="152" width="9" height="3" rx="0.8" fill="#FFFFFF" />
      <rect x="176" y="252" width="9" height="3" rx="0.8" fill="#FFFFFF" />
    </g>

    <!-- 'L' Pillar Body -->
    <g>
      <path d="M 206 48 C 206 28 232 20 258 20 C 272 20 282 28 282 48 L 282 284 L 206 284 Z" fill="url(#whz_l_body)" />
      <path d="M 194 48 C 194 22 226 16 262 16 C 278 16 284 26 284 38 C 284 46 270 38 250 38 C 218 38 202 46 194 48 Z" fill="url(#whz_l_top_curve)" />
      <path d="M 194 48 C 200 40 220 32 248 32 L 248 48 C 224 48 204 52 194 48 Z" fill="#00B4D8" />
      <path d="M 206 48 L 214 48 L 214 284 L 206 284 Z" fill="#0077B6" />
      <path d="M 276 48 L 284 48 L 284 240 L 276 240 Z" fill="#00B4D8" />
      <path d="M 216 42 L 238 42 L 238 108 L 227 98 L 216 108 Z" fill="#FFFFFF" />
    </g>

    <!-- 'L' Swoop Foot -->
    <g>
      <path d="M 244 284 C 242 242 258 206 284 196 C 298 190 316 186 332 198 C 320 216 300 240 276 262 Z" fill="#020914" />
      <path d="M 242 260 C 252 238 274 216 302 206 C 328 196 348 170 350 144 C 354 130 346 122 336 126 C 322 132 310 156 300 180 C 284 212 264 242 242 258 Z" fill="url(#whz_l_swoop_glow)" />
      <path d="M 336 126 C 346 122 354 130 350 144 C 348 162 328 184 304 198 C 278 212 254 238 242 260 L 243 252 C 257 230 282 206 308 190 C 330 176 346 154 348 138 C 350 130 344 124 336 126 Z" fill="url(#whz_l_swoop_top_rim)" />
    </g>

    <!-- Digital Cubes -->
    <g>
      <rect x="344" y="82" width="16" height="16" rx="3.5" fill="url(#whz_cube_orange)" />
      <rect x="322" y="98" width="13" height="13" rx="2.5" fill="url(#whz_cube_cyan)" />
      <rect x="306" y="122" width="13" height="13" rx="2.5" fill="url(#whz_cube_cyan)" />
      <rect x="340" y="118" width="13" height="13" rx="2.5" fill="url(#whz_cube_cyan)" />
      <rect x="324" y="142" width="12" height="12" rx="2" fill="url(#whz_cube_cyan)" />
    </g>
  </g>

  <!-- ==================== 2. EXACT WORDMARK: LEXORA (CRISP WHITE) ==================== -->
  <g transform="translate(225, 25)">
    <!-- Letter 'L' (Crisp White) -->
    <path d="M 0 0 V 82 H 64 V 66 H 22 V 0 Z" fill="#FFFFFF" />

    <!-- Letter 'E' (Crisp White) -->
    <path d="M 84 0 V 82 H 148 V 66 H 106 V 48 H 142 V 33 H 106 V 16 H 148 V 0 Z" fill="#FFFFFF" />

    <!-- Letter 'X' - Signature Luminous Folding Ribbon -->
    <g>
      <path d="M 208 0 L 158 82 H 182 L 232 0 Z" fill="url(#whz_x_leg_back)" />
      <path d="M 188 38 L 202 60 L 190 60 Z" fill="#000000" opacity="0.4" />
      <path d="M 158 0 L 208 82 H 232 L 182 0 Z" fill="url(#whz_x_leg_front)" />
    </g>

    <!-- Letter 'O' (Crisp White) -->
    <path d="M 302 0 C 270 0 248 22 248 41 C 248 60 270 82 302 82 C 334 82 356 60 356 41 C 356 22 334 0 302 0 Z M 302 16 C 322 16 334 27 334 41 C 334 55 322 66 302 66 C 282 66 270 55 270 41 C 270 27 282 16 302 16 Z" fill="#FFFFFF" />

    <!-- Letter 'R' (Crisp White) -->
    <path d="M 380 0 V 82 H 402 V 53 H 418 L 442 82 H 466 L 438 48 C 451 44 460 35 460 24 C 460 11 447 0 427 0 Z M 402 16 H 426 C 435 16 440 20 440 25 C 440 31 435 35 426 35 H 402 Z" fill="#FFFFFF" />

    <!-- Letter 'A' (Modern Stencil Inverted Chevron Apex) -->
    <path d="M 520 0 L 480 82 H 502 L 513 60 H 545 L 520 0 Z M 545 60 L 556 82 H 578 L 538 0 Z" fill="#FFFFFF" />

    <!-- Subtitle with Dividers -->
    <g transform="translate(0, 110)">
      <line x1="0" y1="2" x2="45" y2="2" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round" />
      <text x="260" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="3.5">
        <tspan fill="#E2E8F0">SMART </tspan>
        <tspan fill="#38BDF8">LIBRARY </tspan>
        <tspan fill="#E2E8F0">MANAGEMENT SYSTEM</tspan>
      </text>
      <line x1="475" y1="2" x2="520" y2="2" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round" />
    </g>
  </g>
</svg>
