<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Full bleed background for maskable compatibility -->
  <rect width="512" height="512" fill="url(#bgGrad)" />
  <rect width="512" height="512" fill="url(#glowGrad)" />

  <!-- Content within 80% safe zone (center 400x400) -->
  <g transform="translate(106, 106) scale(0.93)">
    <!-- Book Left Page -->
    <path d="M160 250 C120 220 50 215 10 225 L10 55 C50 45 120 50 160 80 Z" fill="#ffffff" />
    <!-- Book Right Page -->
    <path d="M160 250 C200 220 270 215 310 225 L310 55 C270 45 200 50 160 80 Z" fill="#f1f5f9" />
    
    <!-- Spine Center Line -->
    <path d="M160 70 L160 256" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
    
    <!-- Page Accent Lines - Left -->
    <path d="M45 100 C75 95 120 100 140 115" stroke="#93c5fd" stroke-width="5" stroke-linecap="round" />
    <path d="M45 135 C75 130 120 135 140 150" stroke="#93c5fd" stroke-width="5" stroke-linecap="round" />
    <path d="M45 170 C75 165 120 170 140 185" stroke="#93c5fd" stroke-width="5" stroke-linecap="round" />

    <!-- Page Accent Lines - Right -->
    <path d="M180 115 C200 100 245 95 275 100" stroke="#93c5fd" stroke-width="5" stroke-linecap="round" />
    <path d="M180 150 C200 135 245 130 275 135" stroke="#93c5fd" stroke-width="5" stroke-linecap="round" />
    <path d="M180 185 C200 170 245 165 275 170" stroke="#93c5fd" stroke-width="5" stroke-linecap="round" />

    <!-- Top Sparkle -->
    <circle cx="160" cy="35" r="14" fill="#38bdf8" />
    <circle cx="160" cy="35" r="6" fill="#ffffff" />
  </g>

  <!-- Text within safe zone -->
  <text x="256" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="4">LEXORA</text>
</svg>
