@if (open()) {
  <div class="content-overlay flex justify-end" [style.left]="overlayLeft()">
    <div class="absolute inset-0 bg-black/40" (click)="onClose()"></div>
    <div class="relative w-full sm:max-w-xl bg-background border-l shadow-xl h-full flex flex-col overflow-hidden" (click)="$event.stopPropagation()">
      <div class="p-6 border-b shrink-0">
        <div class="flex items-start justify-between gap-3">
          <div>
            <h2 class="text-lg font-semibold">{{ isEdit() ? 'Edit user' : 'Add user' }}</h2>
            <p class="text-sm text-muted-foreground mt-1">Assign a role to map default permissions and scope.</p>
          </div>
          <button type="button" class="h-8 w-8 rounded-md hover:bg-muted grid place-items-center" (click)="onClose()">
            <svg lucideX class="h-4 w-4"></svg>
          </button>
        </div>
      </div>

      <form class="flex-1 overflow-y-auto p-6 space-y-4" (ngSubmit)="onSubmit()">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div class="space-y-1.5">
            <label class="text-sm font-medium">Full name</label>
            <input
              type="text"
              class="flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm"
              [ngModel]="fullName()"
              (ngModelChange)="fullName.set($event)"
              name="fullName"
              placeholder="Jane Doe"
            />
          </div>
          <div class="space-y-1.5">
            <label class="text-sm font-medium">Email <span class="text-destructive">*</span></label>
            <input
              type="email"
              class="flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm disabled:opacity-50"
              [disabled]="isEdit()"
              [ngModel]="email()"
              (ngModelChange)="email.set($event)"
              name="email"
              required
              placeholder="jane@org.com"
            />
          </div>
          @if (!isEdit()) {
            <div class="space-y-1.5 sm:col-span-2">
              <label class="text-sm font-medium">Password <span class="text-destructive">*</span></label>
              <input
                type="password"
                class="flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm"
                [ngModel]="password()"
                (ngModelChange)="password.set($event)"
                name="password"
                required
                minlength="8"
                placeholder="Min. 8 characters"
              />
            </div>
          }
          <div class="space-y-1.5">
            <label class="text-sm font-medium">Status</label>
            <select
              class="flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm"
              [ngModel]="isActive() ? 'Active' : 'Inactive'"
              (ngModelChange)="isActive.set($event === 'Active')"
              name="status"
            >
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>
          </div>
        </div>

        <div class="border-t pt-4 space-y-2">
          <label class="text-sm font-medium">Role</label>
          <div class="grid grid-cols-1 gap-1.5 max-h-72 overflow-y-auto">
            @for (r of staffRoleOptions; track r.key) {
              <label
                class="flex items-start gap-2.5 rounded-md border p-2.5 cursor-pointer transition"
                [class.border-primary]="selectedRole() === r.key"
                [class.bg-primary/5]="selectedRole() === r.key"
                [class.hover:bg-muted/40]="selectedRole() !== r.key"
              >
                <input
                  type="radio"
                  class="mt-1 accent-primary"
                  name="role"
                  [value]="r.key"
                  [checked]="selectedRole() === r.key"
                  (change)="selectedRole.set(r.key)"
                />
                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="text-sm font-medium">{{ r.label }}</span>
                    <span class="font-mono text-[10px] text-muted-foreground">{{ r.key }}</span>
                  </div>
                  <p class="text-xs text-muted-foreground">{{ r.description }}</p>
                </div>
              </label>
            }
          </div>
        </div>
      </form>

      <div class="flex justify-end gap-2 border-t p-6 shrink-0">
        <app-button type="button" variant="outline" (click)="onClose()">Cancel</app-button>
        <app-button type="button" [disabled]="busy()" (click)="onSubmit()">
          {{ isEdit() ? 'Save changes' : 'Create user' }}
        </app-button>
      </div>
    </div>
  </div>
}
