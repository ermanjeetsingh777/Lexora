<app-page-header eyebrow="Organization" title="Branches"
    description="Physical branch locations across every institution.">
    <div actions class="flex gap-2">
        <a routerLink="/institutions"><app-button size="sm" variant="outline">View institutions</app-button></a>
        <a routerLink="/branches/create"><app-button size="sm">
                <svg lucidePlus class="h-4 w-4 mr-1"></svg> New branch
            </app-button></a>
    </div>
</app-page-header>
