@if (loading()) {
  <div class="rounded-xl border bg-card p-8 text-center text-sm text-muted-foreground">Loading revenue…</div>
} @else if (data(); as d) {
  <section class="grid grid-cols-2 md:grid-cols-5 gap-3">
    <app-kpi-card label="This week" [value]="formatCurrency(d.revenueBreakdown.weekly)" />
    <app-kpi-card label="This month" [value]="formatCurrency(d.revenueBreakdown.monthly)" />
    <app-kpi-card label="This quarter" [value]="formatCurrency(d.revenueBreakdown.quarterly)" />
    <app-kpi-card label="This year" [value]="formatCurrency(d.revenueBreakdown.yearly)" />
    <app-kpi-card label="All time" [value]="formatCurrency(d.revenueBreakdown.allTime)" />
  </section>

  <section class="grid grid-cols-2 md:grid-cols-4 gap-4">
    <app-kpi-card [label]="'Selected · ' + d.periodLabel" [value]="formatCurrency(d.kpis.totalRevenue)" [delta]="0">
      <svg lucideIndianRupee icon class="h-4 w-4"></svg>
    </app-kpi-card>
    <app-kpi-card label="Renewals" [value]="formatCurrency(d.kpis.totalRenewals)" [delta]="0">
      <svg lucideRepeat icon class="h-4 w-4"></svg>
    </app-kpi-card>
    <app-kpi-card label="Avg / bucket" [value]="formatCurrency(d.kpis.avgDailyRevenue)" [delta]="0">
      <svg lucideTrendingUp icon class="h-4 w-4"></svg>
    </app-kpi-card>
    <app-kpi-card label="Pending payments" [value]="d.kpis.pendingCount" [hint]="d.kpis.paidCount + ' paid'">
      <svg lucideAlertTriangle icon class="h-4 w-4"></svg>
    </app-kpi-card>
  </section>

  <app-section-header title="Revenue by period" description="Monthly, quarterly and yearly breakdown" />
  <app-dashboard-revenue-charts [charts]="revenueCharts()" />

  <app-glass-card class="p-5 block">
    <app-section-header [title]="'Selected period · ' + d.periodLabel" description="Revenue vs renewals from filter bar" />
    <div class="h-[320px]">
      <p-chart type="line" [data]="chartData()" [options]="chartOptions" />
    </div>
  </app-glass-card>

  <app-glass-card class="p-5 block mt-4">
    <app-section-header title="Recent transactions" description="Latest plan payments in your scope" />
    <ul class="divide-y text-sm">
      @for (p of d.recentTransactions; track p.id) {
        <li class="flex items-center justify-between py-2.5 gap-3">
          <div class="min-w-0">
            <div class="font-medium truncate">{{ p.memberName }}</div>
            <div class="label-mono truncate">{{ p.planName }}</div>
          </div>
          <div class="text-right shrink-0">
            <div class="tabular-nums font-mono">{{ formatCurrency(p.paidAmount) }}</div>
            <div class="label-mono" [class.text-success]="p.paymentStatus === 'Paid'" [class.text-warning]="p.paymentStatus === 'Pending'">{{ p.paymentStatus }}</div>
          </div>
        </li>
      } @empty {
        <li class="py-6 text-center text-muted-foreground">No transactions in this period.</li>
      }
    </ul>
  </app-glass-card>
}
