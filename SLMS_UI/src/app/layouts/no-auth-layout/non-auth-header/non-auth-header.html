<header class="mx-auto flex max-w-7xl items-center justify-between px-4 py-2 md:px-6">
    <a class="flex items-center gap-2 rounded-xl px-3 py-2 hover:bg-[var(--muted)]/50 transition-colors" routerLink="/">
        <div class="grid h-9 w-9 place-items-center rounded-lg bg-gradient-primary text-white">
            <app-icon name="book-open" [size]="18" />
        </div>
        <span class="text-sm font-semibold tracking-tight">Lexora</span>
    </a>

    <nav class="hidden items-center gap-2 md:flex">
        <a class="rounded-md px-3 py-2 text-sm text-[var(--muted-foreground)] hover:text-[var(--foreground)]"
            routerLink="/features">
            Features
        </a>
        <a class="rounded-md px-3 py-2 text-sm text-[var(--muted-foreground)] hover:text-[var(--foreground)]"
            routerLink="/prices">
            Pricing
        </a>
        <a class="rounded-md px-3 py-2 text-sm text-[var(--muted-foreground)] hover:text-[var(--foreground)]"
            routerLink="/policies">
            Policies
        </a>
    </nav>

    <div class="flex items-center gap-2">
        @if(storageService.isAuthenticated())
        {
            <a class="inline-flex items-center justify-center gap-2 rounded-md bg-[var(--primary)] px-4 py-2 text-sm font-semibold text-[var(--primary-foreground)] shadow hover:bg-[var(--primary)]/90 transition-colors"
                routerLink="/dashboard">
                Dashboard
            </a>
        }@else
        {
            <a class="hidden sm:inline-flex items-center justify-center gap-2 rounded-md border border-[var(--border)] bg-[var(--background)] px-4 py-2 text-sm font-medium text-[var(--foreground)] shadow-sm hover:bg-[var(--muted)]/30 transition-colors"
                routerLink="/register">
                Register
            </a>

            <a class="inline-flex items-center justify-center gap-2 rounded-md bg-[var(--primary)] px-4 py-2 text-sm font-semibold text-[var(--primary-foreground)] shadow hover:bg-[var(--primary)]/90 transition-colors"
                routerLink="/login">
                Login
            </a>
        }
    </div>
</header>
