@if (modalService.isOpen()) {
  <div class="qr-scanner-backdrop fixed inset-0 z-[99999] flex items-center justify-center p-4 sm:p-6 bg-slate-950/85 backdrop-blur-md animate-in fade-in duration-200">
    <div class="qr-scanner-modal relative w-full max-w-md overflow-hidden rounded-3xl border border-white/20 bg-slate-900 shadow-2xl text-white my-auto">
      <!-- Modal Header -->
      <div class="flex items-center justify-between border-b border-white/10 px-5 py-3.5 bg-slate-900/95">
        <div class="flex items-center gap-3">
          <div class="grid h-10 w-10 place-items-center rounded-xl bg-amber-500/20 text-amber-400 shrink-0">
            <app-icon name="camera" [size]="20" />
          </div>
          <div>
            <h3 class="text-base font-semibold leading-tight text-white">Scan Attendance QR</h3>
            <p class="text-xs text-slate-400 mt-0.5">Point camera at Library QR to check in</p>
          </div>
        </div>
        <button
          type="button"
          (click)="close()"
          class="grid h-9 w-9 place-items-center rounded-xl bg-white/5 text-slate-400 hover:bg-white/15 hover:text-white transition-colors"
          aria-label="Close scanner">
          <app-icon name="x" [size]="18" />
        </button>
      </div>

      <!-- Camera Viewfinder Box -->
      <div class="relative bg-black aspect-[4/3] w-full flex items-center justify-center overflow-hidden">
        <video
          #videoElem
          playsinline
          muted
          autoplay
          class="absolute inset-0 w-full h-full object-cover">
        </video>

        <!-- Viewfinder Reticle Overlay -->
        <div class="absolute inset-0 pointer-events-none flex items-center justify-center p-6">
          <div class="relative w-48 h-48 sm:w-56 sm:h-56 rounded-2xl border-2 border-dashed border-amber-400/90 bg-amber-400/5 shadow-[0_0_0_9999px_rgba(0,0,0,0.60)]">
            <!-- Animated Scan Laser Bar -->
            <div class="scanner-laser"></div>
            
            <!-- Corner Brackets -->
            <div class="absolute -top-1 -left-1 w-6 h-6 border-t-4 border-l-4 border-amber-400 rounded-tl-lg"></div>
            <div class="absolute -top-1 -right-1 w-6 h-6 border-t-4 border-r-4 border-amber-400 rounded-tr-lg"></div>
            <div class="absolute -bottom-1 -left-1 w-6 h-6 border-b-4 border-l-4 border-amber-400 rounded-bl-lg"></div>
            <div class="absolute -bottom-1 -right-1 w-6 h-6 border-b-4 border-r-4 border-amber-400 rounded-br-lg"></div>
          </div>
        </div>

        <!-- Camera Controls overlay (Flip camera) -->
        <div class="absolute top-3 right-3 z-10">
          <button
            type="button"
            (click)="toggleFacingMode()"
            class="inline-flex items-center gap-1.5 rounded-full bg-slate-900/80 px-3 py-1.5 text-xs font-medium backdrop-blur border border-white/20 text-white shadow-lg hover:bg-slate-800 transition-all active:scale-95"
            title="Switch front/back camera">
            <app-icon name="refresh-cw" [size]="14" />
            <span>Flip</span>
          </button>
        </div>

        <!-- Starting state loader -->
        @if (isStarting()) {
          <div class="absolute inset-0 bg-slate-950 flex flex-col items-center justify-center gap-3 z-20">
            <div class="h-9 w-9 rounded-full border-3 border-amber-400 border-t-transparent animate-spin"></div>
            <p class="text-xs font-medium text-slate-300">Starting camera…</p>
          </div>
        }

        <!-- Error State -->
        @if (errorMessage()) {
          <div class="absolute inset-0 bg-slate-950/95 flex flex-col items-center justify-center p-6 text-center z-20">
            <div class="grid h-12 w-12 place-items-center rounded-2xl bg-rose-500/20 text-rose-400 mb-3">
              <app-icon name="triangle-alert" [size]="24" />
            </div>
            <p class="text-sm font-semibold text-rose-200 mb-1">Camera Notice</p>
            <p class="text-xs text-slate-300 leading-relaxed mb-4 max-w-xs">{{ errorMessage() }}</p>
            <button
              type="button"
              (click)="toggleFacingMode()"
              class="inline-flex items-center gap-1.5 rounded-xl bg-amber-500 px-4 py-2 text-xs font-semibold text-slate-950 hover:bg-amber-400 transition-colors">
              <app-icon name="refresh-cw" [size]="14" />
              <span>Retry / Switch Camera</span>
            </button>
          </div>
        }
      </div>

      <!-- Footer / Manual Token fallback -->
      <div class="p-4 space-y-2.5 bg-slate-900 border-t border-white/10">
        <p class="text-[11px] font-medium text-slate-400">Or enter kiosk link / token manually:</p>
        <div class="flex items-center gap-2">
          <input
            #tokenInput
            type="text"
            placeholder="Paste library kiosk URL or token..."
            class="flex-1 rounded-xl border border-white/15 bg-slate-950/80 px-3.5 py-2 text-xs text-white placeholder:text-slate-500 focus:border-amber-400 focus:outline-none focus:ring-1 focus:ring-amber-400"
            (keyup.enter)="onManualSubmit(tokenInput)"
          />
          <button
            type="button"
            (click)="onManualSubmit(tokenInput)"
            class="inline-flex items-center justify-center gap-1.5 rounded-xl bg-amber-500 px-4 py-2 text-xs font-semibold text-slate-950 hover:bg-amber-400 transition-colors shrink-0">
            <span>Go</span>
            <app-icon name="arrow-right" [size]="13" />
          </button>
        </div>
      </div>
    </div>
  </div>
}
